<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F3EA">
<title>打字练习</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --ink:#2C2A26; --sub:#8C8577; --line:#E7DFD2;
  --zhu:#C0392B; --navy:#1B3A5C;
  --paper:#F7F3EA; --card:#FFFDF8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Noto Sans SC",sans-serif;
  background:var(--paper); color:var(--ink);
  min-height:100vh; display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
header{padding:42px 24px 8px; text-align:center}
header h1{margin:0; font-size:26px; font-weight:600; letter-spacing:.02em}
header p{margin:8px 0 0; font-size:13px; color:var(--sub); letter-spacing:.04em}

main{flex:1; padding:26px 20px; display:flex; flex-direction:column; gap:16px; justify-content:center; max-width:520px; width:100%; margin:0 auto}

.card{
  position:relative; display:block; text-decoration:none; color:inherit;
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:20px 20px 18px 24px; overflow:hidden;
  transition:transform .15s, box-shadow .15s, border-color .15s;
}
.card::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:5px;
}
.card:hover{transform:translateY(-2px); box-shadow:0 8px 24px rgba(44,42,38,.10); border-color:#D8CFBF}
.card:active{transform:translateY(0)}

.card.hanzi::before{background:var(--zhu)}
.card.ru::before{background:var(--navy)}

.tag{
  display:inline-block; font-size:10.5px; letter-spacing:.1em;
  padding:2px 8px; border-radius:5px; margin-bottom:9px; font-weight:600;
}
.hanzi .tag{background:#FBEBE7; color:var(--zhu)}
.ru .tag{background:#E8EEF4; color:var(--navy)}

.card h2{margin:0 0 7px; font-size:20px; font-weight:600}
.card p{margin:0; font-size:13px; line-height:1.7; color:var(--sub)}
.card .more{
  display:inline-block; margin-top:13px; font-size:12.5px; font-weight:600;
}
.hanzi .more{color:var(--zhu)}
.ru .more{color:var(--navy)}

footer{
  padding:6px 24px calc(env(safe-area-inset-bottom,0px) + 26px);
  text-align:center; font-size:11.5px; color:#A9A294; line-height:1.7;
}
</style>
</head>
<body>
<header>
  <h1>打字练习</h1>
  <p>键盘键位 · 拼音 · 俄语字母</p>
</header>

<main>
  <a class="card hanzi" href="hanzi.html">
    <span class="tag">中文</span>
    <h2>汉字打字</h2>
    <p>200 个易读错的地名与多音字，另有 45 句名言。看字打拼音，练键位也练拼写。</p>
    <span class="more">进入 →</span>
  </a>

  <a class="card ru" href="russian.html">
    <span class="tag">РУССКИЙ</span>
    <h2>俄语打字</h2>
    <p>A1 300 词。ЙЦУКЕН 键位从头记，屏幕键盘跟着亮。</p>
    <span class="more">Войти →</span>
  </a>
</main>

<footer>
  两个练习都带轮次、错词重练与本地存档。<br>
  进度存在浏览器里，换设备不会同步。
</footer>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
