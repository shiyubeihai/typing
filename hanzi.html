<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>汉字打字 · 地名与多音字</title>
<style>
:root{
  --ink:#2C2A26; --sub:#8C8577; --line:#E7DFD2;
  --zhu:#C0392B; --zhu-dark:#96291D; --zhu-soft:#FBEBE7;
  --paper:#F7F3EA; --card:#FFFDF8;
  --ok:#2E8B57; --bad:#C0392B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Noto Sans SC",sans-serif;
  background:var(--paper); color:var(--ink);
  min-height:100vh; display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
header{
  background:linear-gradient(160deg,#C0392B,#96291D);
  color:#fff; padding:14px 16px 12px;
  display:flex; align-items:baseline; gap:10px;
}
header h1{margin:0;font-size:17px;font-weight:600}
header span{font-size:11.5px;color:rgba(255,255,255,.62);letter-spacing:.05em}

.modes{display:flex; gap:8px; padding:9px 16px; background:var(--card); border-bottom:1px solid var(--line)}
.mode{
  flex:1; padding:7px 0; border-radius:9px; border:1px solid var(--line);
  background:#F6F1E7; font-family:inherit; font-size:13px; font-weight:600;
  color:#7A6B58; cursor:pointer; transition:background .15s,color .15s,border-color .15s;
}
.mode.on{background:var(--zhu); border-color:var(--zhu); color:#fff}
.stats{display:flex; background:var(--card); border-bottom:1px solid var(--line)}
.stat{flex:1; text-align:center; padding:8px 4px; border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block; font-size:15px; font-variant-numeric:tabular-nums}
.stat i{display:block; font-style:normal; font-size:10.5px; color:var(--sub); margin-top:1px}
#sDone{font-size:14px}
.bar{height:3px; background:#EDE5D8; flex:0 0 auto}
.bar i{display:block; height:100%; width:0; background:var(--zhu); transition:width .2s}

/* 键盘 */
.kb{padding:8px 6px 6px; background:var(--card); border-bottom:1px solid var(--line); user-select:none}
.krow{display:flex; justify-content:center; gap:5px; margin-bottom:5px; flex-wrap:nowrap}
.krow:last-child{margin-bottom:0}
.key{
  flex:1 1 0; min-width:0; max-width:46px; height:40px; border-radius:7px;
  background:#F6F1E7; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:600; color:#3A3733; line-height:1;
  transition:background .1s, transform .1s; text-transform:uppercase;
}
.key.hot{
  background:var(--zhu); border-color:var(--zhu); color:#fff;
  transform:translateY(-1px); box-shadow:0 3px 8px rgba(192,57,43,.32);
}
.key.press{background:#EFC9C1}

/* 主区 */
main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding:clamp(20px,6vh,64px) 16px 16px}
.chars{display:flex; justify-content:center; flex-wrap:wrap; gap:4px; width:100%}
.unit{display:flex; flex-direction:column; align-items:center; padding:0 10px}
.ch{
  font-family:"Songti SC","Noto Serif SC",serif; font-weight:600;
  font-size:48px; line-height:1.15; color:#B9B2A4;
  transition:color .15s;
}
.syl{
  font-size:15px; color:#B9B2A4; margin-top:7px; letter-spacing:.03em;
  white-space:nowrap; transition:color .15s;
}
.unit.done .ch, .unit.done .syl{color:var(--ok)}
.unit.cur .ch{color:var(--zhu)}
.unit.cur .syl{color:var(--zhu); border-bottom:2px solid var(--zhu); padding-bottom:2px}

.src{font-size:12px; color:var(--sub); margin-top:10px; min-height:17px; text-align:center; letter-spacing:.04em}
/* 句子模式：字号缩小，按标点分行 */
body.mode-sent .chars{flex-direction:column; align-items:center; gap:4px; flex-wrap:nowrap}
body.mode-sent .line{display:flex; flex-wrap:wrap; justify-content:center; width:100%}
body.mode-sent .clause{display:flex; flex-wrap:nowrap}
body.mode-sent .ch{font-size:27px}
body.mode-sent .syl{font-size:11px; margin-top:4px}
body.mode-sent .unit{padding:0 4px}
.unit.punct{padding:0 1px}
.unit.punct .ch{font-size:22px; color:#C9C2B4; font-weight:400}

.speak{
  margin-top:18px; border:1px solid var(--line); background:var(--card);
  border-radius:20px; padding:7px 16px; font-size:13.5px; color:var(--zhu);
  font-family:inherit; cursor:pointer;
}
.speak:active{background:var(--zhu-soft)}
.tip{margin-top:12px; font-size:11.5px; color:#A9A294; text-align:center; line-height:1.6}
.feedback{height:20px; margin-top:8px; font-size:13px; color:var(--bad); opacity:0; transition:opacity .15s}
.feedback.on{opacity:1}

footer{
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  text-align:center; font-size:12px; color:var(--sub);
}
footer button{
  border:0;background:none;color:var(--zhu);font-size:12.5px;font-family:inherit;
  text-decoration:underline;cursor:pointer;padding:4px 8px;
}
footer button:disabled{color:#BFB8AA;text-decoration:none;cursor:default}

@media (max-width:400px){
  .key{height:36px;font-size:14px}
  .ch{font-size:40px}
  .unit{padding:0 7px}
}
</style>
</head>
<body>
<header>
  <h1>汉字打字</h1>
  <span id="sub">地名 · 多音字 · 200 词</span>
</header>

<div class="modes">
  <button class="mode on" data-mode="word" type="button">词语</button>
  <button class="mode" data-mode="sent" type="button">句子</button>
</div>

<div class="stats">

  <div class="stat"><b id="sSpeed">0</b><i>字/分</i></div>
  <div class="stat"><b id="sStreak">0</b><i>连对</i></div>
</div>
<div class="bar"><i id="barFill"></i></div>

<div class="kb" id="kb"></div>

<main>
  <div class="chars" id="chars"></div>
  <div class="src" id="src"></div>
  <button class="speak" id="speak">🔊 发音</button>
  <div class="tip" id="tip">打之前把系统输入法切到英文，否则字母会变成汉字</div>
  <div class="feedback" id="fb"></div>
</main>

<footer>
  <button id="btnReview">重练错词</button>
  <button id="btnPrev">上一词</button>

var TONE_MAP = {
  'ā':'a','á':'a','ǎ':'a','à':'a',
  'ē':'e','é':'e','ě':'e','è':'e',
  'ī':'i','í':'i','ǐ':'i','ì':'i',
  'ō':'o','ó':'o','ǒ':'o','ò':'o',
  'ū':'u','ú':'u','ǔ':'u','ù':'u',
  'ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v'
};
/* 带声调拼音 → 键盘输入串：去调、ü 记作 v */
function keyOf(s){
  var out = '';
  for (var i=0;i<s.length;i++){
    var c = s[i];
    if (c === 'ü') out += 'v';
    else if (TONE_MAP[c]) out += TONE_MAP[c];
    else if (c !== ' ') out += c;
  }
  return out;
}
function sylsOf(p){ return p.split(' ').filter(function(s){ return s.length; }); }
function fullKey(p){ return sylsOf(p).map(keyOf).join(''); }

  ["人生自古谁无死，留取丹心照汗青","rén shēng zì gǔ shuí wú sǐ liú qǔ dān xīn zhào hàn qīng","文天祥"],
  ["与天奋斗，其乐无穷；与地奋斗，其乐无穷；与人奋斗，其乐无穷。","yǔ tiān fèn dòu qí lè wú qióng yǔ dì fèn dòu qí lè wú qióng yǔ rén fèn dòu qí lè wú qióng","毛泽东"],
  ["星星之火，可以燎原","xīng xīng zhī huǒ kě yǐ liáo yuán","毛泽东"],
  ["好好学习，天天向上","hǎo hǎo xué xí tiān tiān xiàng shàng","毛泽东"],
  ["世上无难事，只要肯登攀","shì shàng wú nán shì zhǐ yào kěn dēng pān","毛泽东"],
  ["数风流人物，还看今朝","shǔ fēng liú rén wù hái kàn jīn zhāo","毛泽东"],
  ["一万年太久，只争朝夕","yī wàn nián tài jiǔ zhǐ zhēng zhāo xī","毛泽东"],
  ["雄关漫道真如铁，而今迈步从头越","xióng guān màn dào zhēn rú tiě ér jīn mài bù cóng tóu yuè","毛泽东"],
  ["红军不怕远征难，万水千山只等闲","hóng jūn bù pà yuǎn zhēng nán wàn shuǐ qiān shān zhǐ děng xián","毛泽东"],
  ["天若有情天亦老，人间正道是沧桑","tiān ruò yǒu qíng tiān yì lǎo rén jiān zhèng dào shì cāng sāng","毛泽东"],
  ["不管风吹浪打，胜似闲庭信步","bù guǎn fēng chuī làng dǎ shèng sì xián tíng xìn bù","毛泽东"],
  ["中华儿女多奇志，不爱红装爱武装","zhōng huá ér nǚ duō qí zhì bù ài hóng zhuāng ài wǔ zhuāng","毛泽东"],
  ["没有调查，就没有发言权","méi yǒu diào chá jiù méi yǒu fā yán quán","毛泽东"],
  ["自力更生，艰苦奋斗","zì lì gēng shēng jiān kǔ fèn dòu","毛泽东"],
  ["一切反动派都是纸老虎","yī qiè fǎn dòng pài dōu shì zhǐ lǎo hǔ","毛泽东"],
  ["下定决心，不怕牺牲","xià dìng jué xīn bù pà xī shēng","毛泽东"]
];

/* ========== 键盘 ========== */
var LAYOUT = [
  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l'],
  ['z','x','c','v','b','n','m']
];

/* ========== 状态 ========== */
var MODE = 'word';                    // word | sent
var ROUND_WORD = 30, ROUND_SENT = 10;

var queue = [];
var idx = 0;
var typed = 0;
var totalRight = 0, totalTyped = 0;
var streak = 0, maxStreak = 0;
var startAt = 0, typedChars = 0;
var current = null;
var finished = false;
var mode = 'normal';
var wrongThisWord = false;
var target = '';      // 当前词的无调输入串
var bounds = [];      // 每个字的输入边界

var state = { order: [], roundStart: 0, wrong: {} };

function shuffle(a){
  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}
function pool(){ return MODE === 'word' ? WORDS : SENTENCES; }
function roundSize(){ return MODE === 'word' ? ROUND_WORD : ROUND_SENT; }
function saveKey(){ return MODE === 'word' ? 'hanzi.typing.v1' : 'hanzi.sent.v1'; }

/* ---------- 存档 ---------- */
function freshState(){
  var p = pool();
  var o = [];
  for (var i=0;i<p.length;i++) o.push(i);
  return { order: shuffle(o), roundStart: 0, wrong: {} };
}
function save(){
  try {
    localStorage.setItem(saveKey(), JSON.stringify({
      v: 1, order: state.order, roundStart: state.roundStart, wrong: state.wrong
    }));
  } catch(e){}
}
function loadSave(){
  try {
    var raw = localStorage.getItem(saveKey());
    if (!raw) return false;
    var d = JSON.parse(raw);
    if (!d || d.v !== 1) return false;
    var p = pool(), R = roundSize();
    if (!Array.isArray(d.order) || d.order.length !== p.length) return false;
    for (var i=0;i<d.order.length;i++){
      var n = d.order[i];
      if (typeof n !== 'number' || n < 0 || n >= p.length || n !== Math.floor(n)) return false;
    }
    if (typeof d.roundStart !== 'number' || d.roundStart < 0) return false;
    var w = (d.wrong && typeof d.wrong === 'object') ? d.wrong : {};
    var clean = {};
    Object.keys(w).forEach(function(k){
      var hit = false;
      for (var j=0;j<p.length;j++) if (p[j][0] === k){ hit = true; break; }
      if (!hit) return;
      var c = parseInt(w[k], 10);
      if (c > 0) clean[k] = c;
    });
    state.order = d.order;
    state.roundStart = Math.floor(d.roundStart / R) * R;
    if (state.roundStart >= p.length) state.roundStart = 0;
    state.wrong = clean;
    return true;
  } catch(e){ return false; }
}
function wrongCount(){ return Object.keys(state.wrong).length; }

/* ---------- 轮次 ---------- */
function resetRound(m){
  idx = 0; typed = 0;
  totalRight = 0; totalTyped = 0;
  streak = 0; maxStreak = 0; typedChars = 0;
  startAt = Date.now();
  finished = false;
  mode = m;
  wrongThisWord = false;
}
function loadRound(){
  var p = pool(), R = roundSize();
  if (state.roundStart >= p.length){
    shuffle(state.order);
    state.roundStart = 0;
  }
  var end = Math.min(state.roundStart + R, p.length);
  queue = state.order.slice(state.roundStart, end).map(function(i){ return p[i]; });
  resetRound('normal');
  loadWord();
  updateStats();
  save();
}
function nextRound(){
  if (mode === 'review'){ loadRound(); return; }
  var p = pool(), R = roundSize();
  state.roundStart += R;
  if (state.roundStart >= p.length){
    shuffle(state.order);
    state.roundStart = 0;
  }
  loadRound();
}
function startReview(){
  var keys = Object.keys(state.wrong);
  if (!keys.length){ toast('错词池是空的'); return; }
  var p = pool();
  keys.sort(function(a,b){ return state.wrong[b] - state.wrong[a]; });
  var picked = keys.slice(0, roundSize());
  queue = [];
  picked.forEach(function(zh){
    for (var i=0;i<p.length;i++){
      if (p[i][0] === zh){ queue.push(p[i]); break; }
    }
  });
  shuffle(queue);
  resetRound('review');
  loadWord();
  updateStats();
}
function toast(msg){
  var fb = document.getElementById('fb');
  fb.textContent = msg;
  fb.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ fb.classList.remove('on'); }, 1600);
}

/* ---------- 渲染 ---------- */
function buildKeyboard(){
  var kb = document.getElementById('kb');
  kb.innerHTML = '';
  LAYOUT.forEach(function(row){
    var r = document.createElement('div'); r.className = 'krow';
    row.forEach(function(ch){
      var k = document.createElement('div'); k.className = 'key';
      k.textContent = ch;
      k.dataset.ch = ch;
      k.addEventListener('click', function(){ handleChar(ch); });
      r.appendChild(k);
    });
    kb.appendChild(r);
  });
}
function highlight(ch){
  document.querySelectorAll('.key').forEach(function(k){
    k.classList.toggle('hot', k.dataset.ch === ch);
  });
}
function currentCharIndex(){
  var i = 0;
  while (i < bounds.length && typed >= bounds[i]) i++;
  return Math.min(i, bounds.length - 1);
}
var PUNCT = /[，。？！、；：“”‘’（）《》…—·]/;
function renderWord(){
  var chars = current[0].split('');
  var syls = sylsOf(current[1]);
  target = syls.map(keyOf).join('');

  bounds = [];
  var acc = 0;
  syls.forEach(function(s){ acc += keyOf(s).length; bounds.push(acc); });

  var ci = currentCharIndex();
  var html = '';

  if (MODE === 'sent'){
    /* 三层：句号/分号断行，逗号断小句；放不下时小句整体换行，不拆字 */
    var lines = [], clauses = [], clause = '', si = 0;
    for (var i=0;i<chars.length;i++){
      var c = chars[i];
      if (PUNCT.test(c)){
        clause += '<div class="unit punct"><span class="ch">' + c + '</span><span class="syl"></span></div>';
        if (/[；。？！]/.test(c)){
          if (clause){ clauses.push(clause); clause = ''; }
          lines.push(clauses);
          clauses = [];
        } else if (/[，、：]/.test(c)){
          if (clause){ clauses.push(clause); clause = ''; }
        }
        continue;
      }
      var cls = si < ci ? 'done' : (si === ci ? 'cur' : '');
      clause += '<div class="unit ' + cls + '">'
             +  '<span class="ch">' + c + '</span>'
             +  '<span class="syl">' + (syls[si] || '') + '</span>'
             +  '</div>';
      si++;
    }
    if (clause) clauses.push(clause);
    if (clauses.length) lines.push(clauses);
    html = lines.map(function(cs){
      return '<div class="line">' + cs.map(function(cl){
        return '<div class="clause">' + cl + '</div>';
      }).join('') + '</div>';
    }).join('');
  } else {
    for (var j=0;j<chars.length;j++){
      var c2 = chars[j];
      if (PUNCT.test(c2)){
        html += '<div class="unit punct"><span class="ch">' + c2 + '</span><span class="syl"></span></div>';
        continue;
      }
      var cls2 = j < ci ? 'done' : (j === ci ? 'cur' : '');
      html += '<div class="unit ' + cls2 + '">'
           +  '<span class="ch">' + c2 + '</span>'
           +  '<span class="syl">' + (syls[j] || '') + '</span>'
           +  '</div>';
    }
  }
  document.getElementById('chars').innerHTML = html;
  var srcEl = document.getElementById('src');
  if (srcEl) srcEl.textContent = MODE === 'sent' ? '—— ' + current[2] : '';
  highlight(target[typed] || '');
}
function loadWord(){
  if (idx >= queue.length){ finish(); return; }
  current = queue[idx];
  typed = 0;
  finished = false;
  wrongThisWord = false;
  renderWord();
  document.getElementById('fb').classList.remove('on');
}
function handleChar(ch){
  if (finished || !current) return;
  var want = target[typed];
  if (!want) return;
  var a = ch.toLowerCase();
  totalTyped++;
  if (a === want){
    totalRight++;
    typed++;
    typedChars++;
    var k = document.querySelector('.key[data-ch="' + a + '"]');
    if (k){ k.classList.add('press'); setTimeout(function(){ k.classList.remove('press'); }, 90); }
    if (typed >= target.length){
      streak++;
      maxStreak = Math.max(maxStreak, streak);
      if (!wrongThisWord && state.wrong[current[0]]){
        delete state.wrong[current[0]];
        save();
      }
      idx++;
      updateStats();
      setTimeout(function(){
        if (idx < queue.length) loadWord();
        else finish();
      }, 260);
      return;
    }
    renderWord();
  } else {
    streak = 0;
    if (!wrongThisWord){
      wrongThisWord = true;
      state.wrong[current[0]] = (state.wrong[current[0]] || 0) + 1;
      save();
    }
    var fb = document.getElementById('fb');
    fb.textContent = '应为 «' + want + '»';
    fb.classList.add('on');
    var chEl = document.querySelector('.unit.cur .ch');
    if (chEl){
      chEl.style.color = 'var(--bad)';
      setTimeout(function(){ chEl.style.color = ''; }, 200);
    }
  }
  updateStats();
}
function updateStats(){
  document.getElementById('sDone').textContent = idx + '/' + (queue.length || 0);
  var acc = totalTyped ? Math.round(totalRight/totalTyped*100) : 100;
  document.getElementById('sAcc').textContent = acc + '%';
  var mins = (Date.now()-startAt)/60000;
  document.getElementById('sSpeed').textContent = mins > 0.05 ? Math.round(typedChars/mins) : 0;
  document.getElementById('sStreak').textContent = streak;
  document.getElementById('barFill').style.width =
    (queue.length ? Math.min(100, idx / queue.length * 100) : 0) + '%';
  var n = wrongCount();
  var b = document.getElementById('btnReview');
  var rl = MODE === 'sent' ? '重练错句' : '重练错词';
  b.textContent = n ? rl + ' (' + n + ')' : rl;
  b.disabled = n === 0;
  document.getElementById('btnNext').textContent = mode === 'review' ? '回到练习' : '下一轮';
}
function finish(){
  finished = true;
  var acc = totalTyped ? Math.round(totalRight / totalTyped * 100) : 100;
  var mins = (Date.now() - startAt) / 60000;
  var speed = mins > 0.05 ? Math.round(typedChars / mins) : 0;
  document.getElementById('chars').innerHTML =
    '<div style="font-size:26px;font-weight:600;color:var(--zhu)">'
    + (mode === 'review' ? '重练完成' : '本轮完成') + '</div>';
  var lines = [
    queue.length + (MODE === 'sent' ? ' 句' : ' 词') + ' · 准确率 ' + acc + '% · ' + speed + ' 字/分',
    '最长连对 ' + maxStreak
  ];
  if (mode === 'review'){
    var left = wrongCount();
    lines.push(left ? '错词池还剩 ' + left + ' 个，可再练一遍' : '错词池已清空');
  } else {
    var n = wrongCount();
    lines.push(n ? '错词池 ' + n + ' 个，点左下重练' : '没有新错词');
  }
  var tip = document.createElement('div');
  tip.className = 'tip';
  tip.innerHTML = lines.join('<br>');
  document.getElementById('chars').appendChild(tip);
  var srcEl = document.getElementById('src');
  if (srcEl) srcEl.textContent = '';
  highlight('');
  updateStats();
}
function setMode(m){
  MODE = m;
  document.body.classList.toggle('mode-sent', m === 'sent');
  var sub = document.getElementById('sub');
  if (sub) sub.textContent = m === 'sent' ? '名言短句 · 45 句' : '地名 · 多音字 · 200 词';
  document.querySelectorAll('.mode').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-mode') === m);
  });
  var prevBtn = document.getElementById('btnPrev');
  if (prevBtn) prevBtn.textContent = m === 'sent' ? '上一句' : '上一词';
  if (!loadSave()) state = freshState();
  loadRound();
}
function start(){ setMode(MODE); }
function speak(){
  if (!current) return;
  if (!('speechSynthesis' in window)){ toast('当前浏览器不支持语音'); return; }
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(current[0]);
  u.lang = 'zh-CN';
  u.rate = 0.85;
  var vs = speechSynthesis.getVoices();
  var v = vs.filter(function(x){ return /^zh[-_]CN/i.test(x.lang) || /^zh/i.test(x.lang); })[0];
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ========== 事件 ========== */
document.addEventListener('keydown', function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key.toLowerCase();
  if (k === 'backspace'){
    e.preventDefault();
    if (typed > 0){ typed--; renderWord(); }
    return;
  }
  if (k.length === 1 && k >= 'a' && k <= 'z'){
    e.preventDefault();
    handleChar(k);
  }
});
/* 中文输入法开着时给出提示 */
document.addEventListener('compositionstart', function(){
  toast('检测到中文输入法，请切到英文');
});
document.getElementById('speak').addEventListener('click', speak);
document.getElementById('btnReview').addEventListener('click', startReview);
document.getElementById('btnNext').addEventListener('click', nextRound);
document.getElementById('btnPrev').addEventListener('click', function(){
  if (idx > 0){ idx--; typed = 0; loadWord(); updateStats(); }
});
document.querySelectorAll('.mode').forEach(function(b){
  b.addEventListener('click', function(){ setMode(b.getAttribute('data-mode')); });
});

buildKeyboard();
start();
</script>
